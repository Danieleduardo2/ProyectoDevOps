name: CD Staging Deployment

on:
  push:
    branches:
      - develop

jobs:
  
  # 1. BUILD
  
  build:
    name: Build y empaquetado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar, testear y empaquetar
        working-directory: backend
        run: mvn clean test package      # tests incluidos

      - name: Verificar JAR generado
        run: ls -lh backend/target/*.jar

      - name: Subir JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 3

  
  # 2. DEPLOY A STAGING (Railway automático)
  
  deploy-staging:
    name: Desplegar en Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Esperar despliegue automatico Railway
        run: |
          echo "===== DEPLOY EN RAILWAY ====="
          echo "Railway detecta automaticamente el push a develop"
          echo "Esperando que Railway levante la aplicacion..."
          sleep 90                        # aumentado de 60 a 90

  
  # 3. VERIFICACIÓN POST-DESPLIEGUE (Health Check)
  
  verify-deployment:
    name: Verificar despliegue (Health Check)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: staging

    steps:
      - name: Health check del backend
        continue-on-error: true
        run: |
          echo "===== VERIFICACIÓN POST-DESPLIEGUE ====="
          URL="${{ vars.STAGING_URL }}/actuator/health"

          for i in 1 2 3 4 5; do
            echo "Intento $i: GET $URL"
            STATUS=$(curl --max-time 10 -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "HTTP Status: $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo " Aplicación operativa - Health check exitoso"
              exit 0
            fi

            echo " Esperando... (intento $i/5)"
            sleep 20
          done

          echo " Health check fallido después de 5 intentos"
          exit 1

      - name: Mostrar resumen del despliegue
        if: always()
        run: |
          echo "===== RESUMEN DEL DESPLIEGUE ====="
          echo "Ambiente: staging"
          echo "URL: ${{ vars.STAGING_URL }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"